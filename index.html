<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#170C2A"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta property="og:title" content="شلّتنا — ألعاب المجلس في رابط واحد"><meta property="og:description" content="تحدي يومي، دوري للشلة، وتحدي الفرق. العبوا من أي جوال بدون تحميل."><meta property="og:image" content="https://shillatnasa.github.io/shillatna/og.png"><meta property="og:url" content="https://shillatnasa.github.io/shillatna/"><meta property="og:type" content="website"><meta property="og:locale" content="ar_SA"><meta name="twitter:card" content="summary_large_image"><meta name="description" content="ألعاب المجلس في رابط واحد: تحدي يومي، دوري للشلة، وتحدي الفرق. العبوا من أي جوال بدون تحميل.">
<title>شلّتنا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;700&display=swap">
<style>
/* Layout: a majlis-at-night game table. One column of "cards" on a dark woven ground; Sadu weave bands frame every screen.
   Committed single dark look: night indigo ground, wool-white text, Sadu red / saffron / teal as the game's colors. */
:root{
  color-scheme:dark;
  --night:#170C2A; --night-2:#22143B; --night-3:#2E1D4E; --line:#3E2A63;
  --wool:#FFF3E3; --muted:#B5A3D3;
  --saffron:#FFB627; --saffron-deep:#C7820A; --red:#EF4A3C; --red-deep:#A8261C; --teal:#1FC2A3; --teal-deep:#11826D;
  --sky:#7C9CFF; --rose:#FF79B4; --lime:#C6EE5A;
  --display:"Lalezar","Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
}
html,body{background:var(--night);color:var(--wool)}
body{font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:
    linear-gradient(45deg,rgba(255,243,227,.028) 25%,transparent 25%,transparent 75%,rgba(255,243,227,.028) 75%),
    linear-gradient(45deg,rgba(255,243,227,.028) 25%,transparent 25%,transparent 75%,rgba(255,243,227,.028) 75%);
  background-size:36px 36px;background-position:0 0,18px 18px;min-height:100%}
body.wide #app{max-width:1180px}
.board-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:820px){.board-grid{grid-template-columns:repeat(2,1fr)}body.wide .prompt .q{font-size:clamp(34px,4vw,54px)}}
@media (min-width:1150px){.board-grid{grid-template-columns:repeat(3,1fr)}}
#app{max-width:560px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

/* Sadu weave band */
.sadu{height:22px;border-radius:4px;background:
  linear-gradient(135deg,var(--red) 25%,transparent 25%) 0 0/22px 22px,
  linear-gradient(225deg,var(--red) 25%,transparent 25%) 0 0/22px 22px,
  linear-gradient(315deg,var(--saffron) 25%,transparent 25%) 11px 0/22px 22px,
  linear-gradient(45deg,var(--saffron) 25%,transparent 25%) 11px 0/22px 22px,
  repeating-linear-gradient(90deg,var(--teal) 0 4px,var(--night) 4px 11px);
  box-shadow:inset 0 3px 0 var(--wool),inset 0 -3px 0 var(--wool);animation:weave 18s linear infinite}
.sadu.thin{height:10px;box-shadow:none;background:repeating-linear-gradient(90deg,var(--red) 0 10px,var(--saffron) 10px 20px,var(--teal) 20px 30px,var(--wool) 30px 34px)}
@keyframes weave{to{background-position:220px 0,220px 0,231px 0,231px 0,220px 0}}

h1,h2,.display{font-family:var(--display);font-weight:400;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(56px,16vw,86px);color:var(--saffron);text-shadow:4px 4px 0 var(--red-deep)}
h2{font-size:28px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-size:26px;color:var(--saffron);text-shadow:2px 2px 0 var(--red-deep);display:inline-flex;align-items:center;gap:8px}
.logo{display:inline-flex;line-height:0;flex:0 0 auto}
.logo svg{display:block}
.dal{position:relative;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:var(--saffron);color:var(--night);font-family:var(--display);line-height:1;overflow:hidden;box-shadow:0 3px 0 var(--saffron-deep)}
.dal i{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,var(--red) 0 8px,var(--teal) 8px 16px,var(--wool) 16px 19px)}
.free-list{margin:8px 0 0;padding-inline-start:18px;display:grid;gap:8px;line-height:1.6}.fresh-note{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.icons{display:flex;gap:8px;align-items:center}
.card{background:var(--night-2);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
label{font-size:13px;color:var(--muted);font-weight:500}
input{font:inherit;font-size:18px;padding:13px 15px;border-radius:12px;border:2px solid var(--line);background:var(--night);color:var(--wool);width:100%;box-sizing:border-box;min-width:0}
input::placeholder{color:var(--muted);opacity:.8}
input:focus-visible{outline:none;border-color:var(--saffron)}

/* Game buttons: chunky, pressable */
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:14px;padding:14px 18px 15px;cursor:pointer;flex:1 1 auto;min-width:0;
  background:var(--red);color:var(--wool);box-shadow:0 5px 0 var(--red-deep);transform:translateY(0);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--red-deep)}
.btn.gold{background:var(--saffron);color:var(--night);box-shadow:0 5px 0 var(--saffron-deep)}
.btn.gold:active:not(:disabled){box-shadow:0 1px 0 var(--saffron-deep)}
.btn.teal{background:var(--teal);color:var(--night);box-shadow:0 5px 0 var(--teal-deep)}
.btn.teal:active:not(:disabled){box-shadow:0 1px 0 var(--teal-deep)}
.btn.line{background:transparent;color:var(--wool);border:2px solid var(--line);box-shadow:none}
.btn.sm{font-size:14px;padding:8px 12px;flex:0 0 auto}
.btn.icon{flex:0 0 auto;font-size:14px;padding:8px 11px;background:var(--night-3);color:var(--wool);box-shadow:none;border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.pbtn:focus-visible,.group:focus-visible,.pack:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.chip{font:inherit;font-size:14px;border:2px solid var(--line);background:transparent;color:var(--wool);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip.on{background:var(--teal);color:var(--night);border-color:var(--teal);font-weight:700}
.chip.lock{color:var(--muted);border-style:dashed}
.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--saffron);color:var(--night);border-radius:6px;padding:1px 7px;margin-inline-start:6px;vertical-align:middle}
.tag.red{background:var(--red);color:var(--wool)}
.tag.teal{background:var(--teal);color:var(--night)}

/* The question card: a saffron playing card */
.prompt{position:relative;background:var(--saffron);color:var(--night);border-radius:20px;padding:24px 22px 28px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 var(--saffron-deep)}
.prompt::after{content:"";position:absolute;inset:8px;border:2px dashed rgba(23,12,42,.28);border-radius:14px;pointer-events:none}
.prompt.flip{animation:flip .55s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes flip{from{transform:rotateX(70deg) translateY(-14px);opacity:.2}}
.prompt .q{font-family:var(--display);font-size:clamp(32px,9vw,48px);line-height:1.25;text-wrap:balance}
.prompt .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.8}
.prompt .x2{background:var(--red);color:var(--wool);border-radius:8px;padding:0 9px;opacity:1}
.prompt .hint{font-size:13px;opacity:.85}

/* Player tokens */
.tok{--c:var(--saffron);display:inline-grid;place-items:center;width:30px;height:30px;flex:0 0 30px;background:var(--c);color:var(--night);font-weight:700;font-size:14px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.tok.lg{width:44px;height:44px;flex-basis:44px;font-size:19px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pbtn{--c:var(--saffron);font:inherit;text-align:start;border:2px solid var(--line);background:var(--night);color:var(--wool);border-radius:14px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.pbtn .t{display:flex;flex-direction:column;min-width:0}
.pbtn .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .s{font-size:12px;color:var(--muted)}
.pbtn.done{border-color:var(--c);background:var(--night-3)}
.pbtn.done .s{color:var(--c)}
.pbtn.static{cursor:default}

/* Reveal */
.group{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--night)}
.group.click{cursor:pointer}
.group.sel{border-color:var(--lime);background:var(--night-3)}
.group .body{min-width:0;flex:1}
.group .w{font-family:var(--display);font-size:28px;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.group .who{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.group .who span.nm{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--night-3);border-radius:999px;padding:2px 10px 2px 4px}
.group .who .tok{width:20px;height:20px;flex-basis:20px;font-size:11px}
.group .pts{margin-inline-start:auto;font-family:var(--display);font-size:30px;color:var(--teal);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.group.solo .pts{color:var(--muted);font-family:var(--body);font-size:13px;direction:rtl}
.group.solo .w{color:var(--muted)}
.group.wave{background:var(--teal);border-color:var(--teal);color:var(--night)}
.group.wave .pts{color:var(--night)}
.group.wave .who span.nm{background:rgba(23,12,42,.18);color:var(--night)}
.wave-tag{font-family:var(--body);font-size:12px;font-weight:700;background:var(--night);color:var(--saffron);border-radius:8px;padding:2px 8px;vertical-align:middle;margin-inline-start:8px}
.group.anim{animation:pop .5s cubic-bezier(.2,.9,.3,1.4) backwards;animation-delay:var(--d,0s)}
.group.wave.anim{animation-name:bigpop}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes bigpop{0%{opacity:0;transform:scale(.6) rotate(-3deg)}70%{transform:scale(1.04) rotate(1deg)}}

/* Leaderboard with bars */
.score{display:grid;grid-template-columns:22px 30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-variant-numeric:tabular-nums}
.score .rk{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center}
.score.first .rk{color:var(--saffron)}
.score .mid{display:flex;flex-direction:column;gap:4px;min-width:0}
.score .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score.first .nm{font-weight:700}
.score .track{height:8px;background:var(--night);border-radius:99px;overflow:hidden}
.score .track i{display:block;height:100%;background:var(--c,var(--saffron));border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.score b{font-family:var(--display);font-weight:400;font-size:22px}

.bar{height:10px;background:var(--night-2);border-radius:99px;overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s linear}
.bar.hurry i{background:var(--red)}
.fx{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(23,12,42,.97);pointer-events:none;animation:fxin .22s ease-out}
.fx.soft{background:rgba(23,12,42,.96)}
.fx.out{opacity:0;transition:opacity .2s}
@keyframes fxin{from{opacity:0}}
.fx-band{width:min(78vw,380px);height:18px;border-radius:4px;animation:weave 1.2s linear infinite}
.fx-word{font-family:Lalezar,'Readex Pro',sans-serif;font-size:min(42vw,200px);line-height:1;color:var(--saffron);text-shadow:7px 7px 0 var(--red-deep,#A8261C);animation:bigpop .55s cubic-bezier(.2,1.4,.4,1)}
.fx-word.go{color:var(--teal);font-size:min(30vw,150px)}
.fx-small{font-family:Lalezar,'Readex Pro',sans-serif;font-size:30px;color:var(--wool,#FFF3E3)}
.fx-tag{background:var(--lime);color:var(--night);font-weight:700;border-radius:10px;padding:4px 14px;animation:pulse 1s ease-in-out infinite}
.note{font-size:13px;color:var(--muted);background:var(--night-3);border-radius:12px;padding:10px 12px}
.flash{color:var(--rose);font-weight:500;font-size:14px}
.steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:center}
.steps .tok{flex-shrink:0}
.secret{display:flex;flex-direction:column;gap:14px;text-align:center;align-items:stretch}
.secret .who{font-family:var(--display);font-size:46px;line-height:1.1}
.big-done{font-family:var(--display);font-size:32px;color:var(--teal)}
.code{font-family:var(--display);font-size:64px;letter-spacing:.14em;color:var(--saffron);text-shadow:3px 3px 0 var(--red-deep);font-variant-numeric:tabular-nums;direction:ltr;text-align:center}
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.hero .lead{font-size:18px;color:var(--wool);max-width:30em}
.tokrow{display:flex;gap:6px}
.tokrow .tok{animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}
@keyframes bob{50%{transform:translateY(-6px)}}
.winner{text-align:center;align-items:center;background:var(--night-3);border-color:var(--saffron)}
.winner h1{font-size:clamp(44px,13vw,70px)}
.podium{direction:ltr;display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%;margin-top:6px}
.podium.two .pod{max-width:170px}
.pod{direction:rtl;flex:1 1 0;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .tokrow,.pod-n,.pod-s,.pod-crown{opacity:0;animation:podin .45s ease-out forwards;animation-delay:calc(var(--d) + .45s)}
@keyframes podin{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
.pod-n{font-family:Lalezar,'Readex Pro',sans-serif;font-size:20px;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.p1 .pod-n{font-size:24px;color:var(--saffron)}
.pod-s{font-size:13px;color:var(--muted)}
.pod-crown{color:var(--saffron);animation:podin .45s ease-out forwards,bob 1.6s ease-in-out infinite;animation-delay:calc(var(--d) + .6s),calc(var(--d) + 1.1s)}
.pod-b{width:100%;border-radius:12px 12px 4px 4px;display:flex;justify-content:center;padding-top:8px;transform-origin:bottom;transform:scaleY(0);animation:rise .6s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:var(--d);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.pod-b span{font-family:Lalezar,'Readex Pro',sans-serif;font-size:40px;line-height:1;color:var(--night)}
.p1 .pod-b{height:128px;background:var(--saffron)}
.p2 .pod-b{height:92px;background:var(--sky)}
.p3 .pod-b{height:64px;background:var(--rose)}
@keyframes rise{to{transform:scaleY(1)}}
.titles{display:grid;gap:10px}
.title-chip{display:flex;gap:12px;align-items:center;background:var(--night-2);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.title-chip .ico{color:var(--lime)}
.title-chip b{font-family:Lalezar,'Readex Pro',sans-serif;font-weight:400;font-size:20px;color:var(--lime)}
.title-chip .n{font-weight:700}
@media (prefers-reduced-motion:reduce){.pod .tokrow,.pod-n,.pod-s,.pod-crown{opacity:1;animation:none}.pod-b{transform:none;animation:none}}

/* Store */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pack{--c:var(--teal);font:inherit;text-align:start;color:var(--wool);background:var(--night);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative;overflow:hidden;min-width:0}
.pack::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:var(--c)}
.pack .pn{font-family:var(--display);font-size:22px;line-height:1.2;margin-top:4px}
.pack .pc{font-size:12px;color:var(--muted)}
.pack .pp{font-weight:700;font-size:14px;color:var(--c)}
.pack.on{border-color:var(--c);background:var(--night-3)}
.pack.lock{opacity:.75}
.bundle{background:var(--red);border-color:var(--red);color:var(--wool)}
.bundle .muted{color:rgba(255,243,227,.85)}

/* Mode picker */
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:-8px}
.mode{font:inherit;text-align:start;cursor:pointer;color:var(--night);background:var(--red);border:0;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 7px 0 var(--red-deep);position:relative;overflow:hidden}
.mode:active{transform:translateY(5px);box-shadow:0 2px 0 var(--red-deep)}
.mode::after{content:"";position:absolute;inset:auto -20px -26px auto;width:120px;height:120px;background:var(--saffron);opacity:.9;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.mode-top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.mode-name{font-family:var(--display);font-size:36px;line-height:1.1;color:var(--wool)}
.mode-sub{font-size:15px;color:var(--wool);max-width:30em;position:relative;z-index:1}
.mode-meta{font-size:13px;font-weight:700;color:var(--night);background:var(--wool);border-radius:999px;padding:3px 12px;align-self:flex-start;position:relative;z-index:1}
.mode-w .mode-name{color:var(--saffron)}
.mode-w .mode-sub{color:var(--muted)}

/* Team challenge */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{--c:var(--red);background:var(--night-2);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.team.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.team .tn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c)}
.team .ts{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.team .tt{font-size:12px;color:var(--muted)}
.team input{font-size:16px;padding:9px 11px}
.lifes{display:flex;gap:6px;flex-wrap:wrap}
.life{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--c);color:var(--wool);background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer}
.life:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.life.armed{background:var(--c);color:var(--night)}
.cat{background:var(--night-2);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cat .cn{font-family:var(--display);font-size:22px;line-height:1.2;color:var(--cc)}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cat2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:8px;align-items:stretch;flex-direction:row}
.tcol{display:flex;flex-direction:column;gap:6px}
.cat-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.cat-mid .cn{font-family:var(--display);font-size:17px;line-height:1.15}
.note.hot{border-color:var(--red);color:var(--wool);background:rgba(239,74,60,.18)}
.sect-h{font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.02em}
#splitnames{width:100%;min-height:96px;resize:vertical;font:inherit;background:var(--night);color:var(--wool);border:1.5px solid var(--line);border-radius:12px;padding:10px}

.mode{padding-left:70px}.mode-masc{position:absolute;left:6px;bottom:8px;width:60px;height:60px;z-index:1;pointer-events:none;transform:rotate(-6deg);filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.mode:hover .mode-masc,.mode:focus-visible .mode-masc{animation:mbob .8s ease-in-out}
.daily-card{position:relative;padding-left:84px}.daily-card .mode-masc{width:66px;height:66px;left:10px;top:50%;bottom:auto;margin-top:-33px}
.cheer-m{width:130px;height:130px;margin:0 auto 4px;animation:mjump .6s cubic-bezier(.3,1.6,.5,1) both}
.dmasc{width:86px;height:86px;margin:0 auto;animation:mbob 2.4s ease-in-out infinite}
@keyframes mbob{50%{transform:translateY(-6px) rotate(3deg)}}@keyframes mjump{from{transform:translateY(60px) scale(.4)}}
@media (prefers-reduced-motion:reduce){.masc{animation:none!important}}

.imgsheet{position:fixed;inset:0;z-index:70;background:rgba(10,6,25,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.imgsheet img{max-height:72vh;max-width:100%;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}.imgsheet p{color:#fff;font-weight:700;text-align:center;margin:0}.imgsheet .btn{min-width:160px}

.lg h2{margin:0}.lg-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.lg-code{background:rgba(255,182,39,.15);color:var(--saffron);font-weight:800;border-radius:999px;padding:4px 12px;font-size:15px;direction:ltr}
.lg .btn{width:100%;margin-top:10px}.lgjoin{display:flex;gap:8px;margin-top:10px}.lgjoin input{flex:1}.lgjoin .btn{width:auto;margin:0}
.lg-list{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}.lg-list li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
.lg-list li.top{background:rgba(255,182,39,.18);border:1.5px solid var(--saffron)}.lg-list b{width:28px;text-align:center}.lg-list .n{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-list li.me .n::after{content:' (أنت)';opacity:.6;font-weight:400}.lg-list .d{opacity:.65;font-size:14px}.lg-list .s{font-weight:800;color:var(--saffron);min-width:56px;text-align:left}

.ram-card{position:relative;overflow:hidden;border-radius:20px;padding:56px 18px 18px;text-align:center;background:linear-gradient(160deg,#3a1f5e,#1d1240);border:2px solid var(--sc,#FFD25C);box-shadow:0 7px 0 rgba(0,0,0,.3)}
.ram-l{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none}.ram-l svg{width:26px;height:52px;transform-origin:top center;animation:swing 3s ease-in-out infinite}
.ram-l svg:nth-child(2){animation-delay:-1s;height:64px}.ram-l svg:nth-child(3){animation-delay:-2s}
.ram-k{font-family:var(--display);font-size:34px;color:var(--sc,#FFD25C)}.ram-l span{font-size:30px;margin-top:10px;display:inline-block;animation:swing 3s ease-in-out infinite}.sea-pick summary{cursor:pointer;font-weight:700}.sea-pick .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.sea-pick .chip.on{background:var(--saffron);color:var(--night)}.ram-t{margin:6px 0 0;font-size:15px;line-height:1.6;opacity:.92}
@keyframes swing{50%{transform:rotate(6deg)}}
body.ramadan .hero{box-shadow:inset 0 0 0 3px var(--sc,#FFD25C)}
@media (prefers-reduced-motion:reduce){.ram-l svg{animation:none}}

.ugc{position:relative;padding-left:96px;border:2px dashed var(--teal)}.ugc-m{position:absolute;left:10px;top:50%;margin-top:-38px;width:76px;height:76px}
.ugc-k{font-family:var(--display);font-size:24px;color:var(--teal)}.ugc-t{font-size:14.5px;line-height:1.6;margin:6px 0 10px;opacity:.92}

.rpt{font-size:14px;color:var(--muted,#b5a3d3)}.rpt summary{cursor:pointer;text-align:center;opacity:.8;padding:6px}
.rpt textarea,.fb textarea{width:100%;border-radius:12px;padding:10px;font:inherit;background:rgba(255,255,255,.06);color:inherit;border:1px solid rgba(255,255,255,.18)}
.fb{text-align:center;gap:10px;display:flex;flex-direction:column;align-items:center}.fb-stars{display:flex;gap:6px;direction:ltr}
.fb-s{font-size:32px;line-height:1;background:none;border:0;color:rgba(255,255,255,.25);cursor:pointer;padding:4px}.fb-s.on{color:#FFB627}
</style>

 {id:'cousins',name:'عزيمة العيلة الكبيرة',c:'var(--sky)',q:['أكثر شي كنتوا تسوونه في بيت الجد','وين كنتوا تلعبون وأنتم صغار','لعبة كنتوا تلعبونها مع عيال خالكم','أول شي تسويه إذا دخلت بيت خالتك','أكثر سالفة تتكرر في كل عزيمة','وش تقول الخالة أول ما تشوفك','أكلة تشتهر فيها عزايم العيلة','وش كنتوا تسوون ليلة العيد في بيت العيلة','وين يجلسون الشباب في العزيمة','أول سؤال يسألك عنه الكبار','وش يسوي الصغار إذا الكبار ناموا','أكثر شي تتذكره من سفرات العيلة','لعبة ورق تلعبونها في العزايم','وش يجيب الخال معه إذا زار','وش تسوون إذا اجتمعتوا بعد العشاء','وش تقول إذا أحد سألك «متى نفرح فيك؟»','أكثر يوم في الأسبوع تجتمع فيه العيلة','أكثر شي ينقال عند التوديع','أكثر شي يحبه الجد','وش تسوي إذا شفت خالك فجأة في السوق','أكثر شي يتأخر في العزيمة الكبيرة','حلى يخلص أول شي في العزيمة','وش تسوون إذا انقطعت الكهرباء في العزيمة','أكثر صورة تنحط في قروب العيلة','وين تروحون كلكم مع بعض في الإجازة']},

const TAB_ID=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function sbRoomNS(){return {join:async(name)=>{
  const ch=SB.channel('room-'+name,{config:{presence:{key:TAB_ID}}});let list=[],cbs=[];
  const sync=()=>{const st=ch.presenceState();list=Object.entries(st).map(([k,arr])=>({peer:k,sameTab:k===TAB_ID,presence:(arr&&arr.length?arr[arr.length-1].p:null)||null}));cbs.slice().forEach(f=>{try{f();}catch(e){}});};
  ch.on('presence',{event:'sync'},sync);
  await new Promise((res,rej)=>{const to=setTimeout(()=>rej(Object.assign(new Error('timeout'),{code:'timeout'})),10000);ch.subscribe(st=>{if(st==='SUBSCRIBED'){clearTimeout(to);res();}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){clearTimeout(to);rej(new Error(st));}});});
  await ch.track({p:null});
  return {peers:()=>list,presence:async o=>{const r=await ch.track({p:o});if(r!=='ok')throw new Error('track '+r);},
    onPeers:(cb,err)=>{cbs.push(cb);return ()=>{cbs=cbs.filter(x=>x!==cb);};},
    leave:async()=>{try{await ch.untrack();}catch(e){}try{await SB.removeChannel(ch);}catch(e){}}};}};}
function errMsg(e){const c=e&&e.code;if(c==='not_permitted'||c==='not_granted')return 'حسابك ما يقدر يدخل غرف اللعب هنا. جرّب وضع الجوال الواحد.';if(c==='limit_reached')return 'الغرف مزحومة الحين، جرّب بعد شوي.';return 'صار خطأ في الاتصال. جرّب مرة ثانية.';}
function myPeer(){const p=G&&G.peers().find(x=>x.sameTab);return p?p.peer:null;}
let lastPush='';function pushHost(){if(!G||!isHost)return;const js=JSON.stringify(S)+'|'+myName;if(js===lastPush)return;lastPush=js;G.presence({r:'h',n:myName.slice(0,16),s:S}).catch(()=>{lastPush='';});}

async function createRoom(){
  if(!myName.trim()){flash='اكتب اسمك أول.';render();return;}
  if(busy)return;busy=true;flash='';render();
  try{
    for(let t=0;t<3;t++){
      const c=String(Math.floor(1000+Math.random()*9000));
      const g=await roomNS.join('nafs-'+c);
      await sleep(1200);
      if(g.peers().some(p=>!p.sameTab&&p.presence&&p.presence.r==='h')){await g.leave();continue;}
      G=g;code=c;isHost=true;hostAns=null;myAns=null;lastPush='';
      S={ph:'lobby',k:'',qi:-1,rd:0,n:rounds,sec:secs,c:0,tot:1,pl:[['H',myName.trim().slice(0,16),0]],rv:null,g:roomGame};
      G.onPeers(onRoomChange,()=>{});
      pushHost();view=roomGame==='team'?'tsetup':'online';busy=false;wake();render();return;
    }
    flash='ما قدرنا نحجز كود، جرّب مرة ثانية.';
  }catch(e){flash=errMsg(e);}
  busy=false;render();
}
async function joinRoom(){
  const c=(($('#code')||{}).value||'').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\D/g,'');
  if(!myName.trim()){flash='اكتب اسمك أول.';render();return;}
  if(c.length!==4){flash='الكود ٤ أرقام.';render();return;}
  if(busy)return;busy=true;flash='';render();
  try{
    const g=await roomNS.join('nafs-'+c);
    G=g;code=c;isHost=false;S=null;myAns=null;lastKey='';hostGoneAt=0;
    await G.presence({r:'p',n:myName.trim().slice(0,16)});
    G.onPeers(onRoomChange,()=>{});
    joinWaitUntil=Date.now()+6000;view='online';busy=false;wake();render();return;
  }catch(e){flash=errMsg(e);}
  busy=false;render();
}
async function leaveRoom(){clearTimeout(hostTimer);clearTimers();try{G&&await G.leave();}catch(e){}G=null;S=null;isHost=false;view='home';render();}

function onRoomChange(){if(!G)return;if(isHost)hostSync();else clientSync();render();}
function clientSync(){
  const hp=G.peers().find(p=>!p.sameTab&&p.presence&&p.presence.r==='h'&&p.presence.s&&typeof p.presence.s==='object');
  if(hp){
    const ns=hp.presence.s;
    if(!Array.isArray(ns.pl))return;
    const key=ns.ph+'|'+ns.k;
    if(key!==lastKey){lastKey=key;phaseStart=Date.now();mergeSel=-1;if(ns.ph==='q')focusAnswer();if(ns.ph==='end')timers.push(setTimeout(()=>{SFX.win();confetti();},200));}
    S=ns;hostGoneAt=0;
  }else if(S&&!hostGoneAt){hostGoneAt=Date.now();}
}
function hostSync(){
  const peers=G.peers();
  for(const p of peers){
    const pr=p.presence||{};
    if(p.sameTab||pr.r!=='p'||typeof pr.n!=='string')continue;
    const nm=pr.n.trim().slice(0,16)||'لاعب';
    const i=S.pl.findIndex(x=>x[0]===p.peer);
    if(i<0){if(S.pl.length<12){S.pl.push([p.peer,nm,0]);if(S.ph==='lobby')SFX.pop();}}else S.pl[i][1]=nm;
  }
  if(S.g==='out'&&/^o[dvg]$/.test(S.ph))oHost();
  if(S.g==='team'){teamHost();teamPush();return;}
  if(S.ph==='q'){
    const ans=collect();let c=0,tot=0;
    const present=new Set(peers.map(p=>p.peer));
    S.pl.forEach(([k],i)=>{if(k!=='H'&&!present.has(k))return;tot++;if(ans[i].v.trim())c++;});
    S.c=c;S.tot=tot;
    if(tot>1&&c>=tot){reveal();return;}
  }
  pushHost();
}
function collect(){
  const peers=G.peers();
  return S.pl.map(([k],i)=>{
    if(k==='H')return{i,v:hostAns&&hostAns.k===S.k?hostAns.v:''};
    const p=peers.find(x=>x.peer===k);const a=p&&p.presence&&p.presence.a;
    return{i,v:(a&&a.k===S.k&&typeof a.v==='string')?a.v.slice(0,24):''};
  });
}
function applyHost(){const s=scoresFrom(hostBase,S.rv,multFor(S.rd,S.n));S.pl.forEach((p,i)=>p[2]=s[i]||0);}
function reveal(){
  if(!isHost||S.ph!=='q')return;
  clearTimeout(hostTimer);
  const ans=collect();
  hostBase=S.pl.map(p=>p[2]);
  S.rv=groupAns(ans);applyHost();
  S.ms=ans.filter(a=>!a.v.trim()).map(a=>a.i);
  S.ph='rv';lastKey='rv|'+S.k;mergeSel=-1;pushHost();render();
}
function nextRound(){
  clearTimers();
  if(S.rd>=S.n){S.ph='end';S.rv=null;pushHost();timers.push(setTimeout(()=>{SFX.win();confetti();},200));render();return;}
  S.rd++;S.qi=deck[S.rd-1];markUsed(S.qi);S.k=Math.random().toString(36).slice(2,8);
  S.ph='q';S.rv=null;S.ms=null;S.c=0;hostAns=null;
  phaseStart=Date.now();lastKey='q|'+S.k;
  clearTimeout(hostTimer);hostTimer=setTimeout(reveal,S.sec*1000+800);

        isHost?h('button',{class:'btn gold sm',type:'button',onclick:e=>{const b=e.currentTarget;navigator.clipboard.writeText(code).then(()=>{b.textContent='انتسخ ✓';}).catch(()=>{b.textContent=code;});}},'انسخ الكود'):null),

function saveMine(){try{localStorage.setItem('nafs-mine',JSON.stringify(MINE));return true;}catch(e){return false;}}
function mineReady(){return MINE.filter(x=>x.a&&x.a.trim());}
function mineCat(){const r=mineReady();if(r.length<3)return null;const q={200:[],400:[],600:[]};
  r.forEach((x,i)=>q[[200,400,600][Math.floor(i/2)%3]].push([(x.q||'').trim()||'وش هذي الصورة؟',x.a.trim(),'mine:'+MINE.indexOf(x)]));
  return {id:'mine',name:'صوركم',c:'#FF79B4',q};}
function addMinePhotos(files){
  [...files].slice(0,24-MINE.length).forEach(f=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);MINE.push({img:c.toDataURL('image/jpeg',.72),a:'',q:''});
    if(!saveMine()){MINE.pop();flash='ما فيه مساحة لصور زيادة على هذا الجهاز. احذفوا صورة وجرّبوا.';}render();};im.src=fr.result;};fr.readAsDataURL(f);});
  if(MINE.length>=24)flash='الحد ٢٤ صورة.';}
function mineCard(){
  const list=MINE.map((x,i)=>h('div',{class:'mine-row'},h('img',{src:x.img,alt:'صورة '+toAr(i+1),class:'mine-th'}),
    h('div',{class:'stack',style:'gap:6px;flex:1;min-width:0'},
      h('input',{id:'mine-a-'+i,maxlength:40,placeholder:'الجواب (مثلاً: مزرعة جدي)',value:x.a,oninput:e=>{const b=mineReady().length>=3;x.a=e.target.value;saveMine();if((mineReady().length>=3)!==b)render();}}),
      h('input',{id:'mine-q-'+i,maxlength:60,placeholder:'السؤال (اختياري)',value:x.q,oninput:e=>{x.q=e.target.value;saveMine();}})),
    h('button',{class:'btn line sm',type:'button','aria-label':'احذف الصورة',onclick:()=>{MINE.splice(i,1);saveMine();if(mineReady().length<3)tCatSel.delete('mine');render();}},'حذف')));
  const n=mineReady().length;
  return h('div',{class:'card'},h('h2',null,'فئة «صوركم»'),
    h('p',{class:'small muted'},'حطوا صور من جوالكم: أماكن رحتوها، أكلات أمكم، صور العيلة زمان. اكتبوا جواب كل صورة وتصير فئة في التحدي. الصور تنحفظ على هذا الجهاز بس.'),
    list.length?h('div',{class:'stack',style:'gap:10px'},list):null,
    h('label',{class:'btn gold',for:'mine-file',style:'text-align:center'},ico('spark',20),' أضف صور'),

    h('p',{class:'small muted'},n>=3?'جاهزة: '+toAr(n)+' صور بجوابها. اختاروا «صوركم» من الفئات فوق.':'تحتاجون ٣ صور على الأقل بجوابها عشان تطلع الفئة.'));
}

function render(){if(view==='trivia')tSave();if(G&&isHost&&S&&S.g==='team')teamPush();document.body.classList.toggle('wide',view==='trivia');{const z=season();document.body.classList.toggle('ramadan',!!z);if(z)document.body.style.setProperty('--sc',z.col);}

  const v=view==='hsetup'?vHeadsSetup():view==='heads'?vHeads():view==='osetup'?vOutsiderSetup():view==='outsider'?vOutsider():view==='lsetup'?vLocalSetup():view==='local'?vLocal():view==='online'?vOnline():view==='store'?vStore():view==='tsetup'?vTSetup():view==='trivia'?vTrivia():view==='daily'?vDaily():view==='admin'?vAdmin():vHome();

function tick(){
  if(view==='heads'){hTick();return;}
  if(view==='outsider'){outTick();return;}
  if(view==='online'&&S&&S.g==='out'){oTick();return;}
  if(view==='trivia'){tTick();return;}
  if(view==='local'&&L&&L.ph==='q'&&L.who>=0&&L.sec){
    const left=Math.max(0,L.sec-(Date.now()-L.t0)/1000),sec=Math.ceil(left);
    const b=document.getElementById('lbar'),t=document.getElementById('lleft'),w=document.getElementById('lbarw');
    if(b)b.style.width=(100*left/L.sec)+'%';
    if(w)w.classList.toggle('hurry',left<=5);
    if(t)t.textContent=left>0?toAr(sec)+' ثانية':'خلص الوقت!';
    if(left>0&&left<=5&&sec!==lastTickSec){lastTickSec=sec;SFX.tick();}
    if(left<=0){const i=L.who,el=document.getElementById('sec-'+L.rd+'-'+i),v=el?(el.value||'').trim().slice(0,24):'';if(v){L.ans[i]=v;SFX.send();}else SFX.solo();L.who=-1;render();}
    return;
  }
  if(view!=='online'||!S||S.ph!=='q')return;
  const left=Math.max(0,S.sec-(Date.now()-phaseStart)/1000),sec=Math.ceil(left);
  const b=document.getElementById('bar'),t=document.getElementById('tleft'),w=document.getElementById('barw');
  if(b)b.style.width=(100*left/S.sec)+'%';
  if(w)w.classList.toggle('hurry',left<=5);
  if(t)t.textContent=toAr(sec)+' ثانية';
  if(left>0&&left<=5&&sec!==lastTickSec){lastTickSec=sec;SFX.tick();}
}
